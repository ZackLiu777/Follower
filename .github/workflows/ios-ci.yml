name: iOS CI

on:
  pull_request:
    branches: ["main", "gamma", "lambda", "sigma"]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone GRDB (Vendored Dependency)
        run: |
          mkdir -p Vendor
          cd Vendor
          git clone --depth 1 --branch v7.11.0 \
            https://github.com/groue/GRDB.swift.git GRDB.swift-7.11.0

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -project Follower.xcodeproj \
            -scheme Follower \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:FollowerTests \
            -derivedDataPath /tmp/FollowerDD CODE_SIGNING_ALLOWED=NO

      - name: Run Required Unit Tests (must pass — purely deterministic)
        run: |
          xcodebuild test-without-building \
            -project Follower.xcodeproj \
            -scheme Follower \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:FollowerTests/ModelsTests \
            -only-testing:FollowerTests/ThemeTests \
            -only-testing:FollowerTests/LocalizationTests \
            -only-testing:FollowerTests/LambdaTests \
            -only-testing:FollowerTests/PremiumServicesTests \
            -only-testing:FollowerTests/DecisionsEngineTests \
            -only-testing:FollowerTests/TrendChartTests \
            -only-testing:FollowerTests/PhiServicesTests \
            -only-testing:FollowerTests/AppStateTests \
            -only-testing:FollowerTests/FollowerTests \
            -only-testing:FollowerTests/DistributionTests \
            -only-testing:FollowerTests/FeatureEngineTests \
            -only-testing:FollowerTests/GLMGradientTests \
            -only-testing:FollowerTests/LaplaceTests \
            -only-testing:FollowerTests/MatrixTests \
            -only-testing:FollowerTests/MockDataForecastTests \
            -only-testing:FollowerTests/PredictionServiceTests \
            -only-testing:FollowerTests/RollingForecastTests \
            -only-testing:FollowerTests/SimulationCalibrationTests \
            -only-testing:FollowerTests/TestHelpers \
            -only-testing:FollowerTests/DashboardAutoSyncTests \
            -only-testing:FollowerTests/DecisionTemplateTests \
            -only-testing:FollowerTests/FeatureExtractorTests \
            -only-testing:FollowerTests/PostAssistantServiceTests \
            -only-testing:FollowerTests/PostQueueViewModelTests \
            -only-testing:FollowerTests/PostQueueViewModelTests \
            -only-testing:FollowerTests/BestPostingTimeServiceTests \
            -only-testing:FollowerTests/HeatmapTierTests \
            -only-testing:FollowerTests/ScoreTierTests \
            -only-testing:FollowerTests/ImpactEstimatorTests \
            -derivedDataPath /tmp/FollowerDD CODE_SIGNING_ALLOWED=NO

      - name: Run Flaky Tests (shared DB / @MainActor VM / UI timing — allowed to fail)
        run: |
          xcodebuild test-without-building \
            -project Follower.xcodeproj \
            -scheme Follower \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:FollowerTests/RepositoryTests \
            -only-testing:FollowerTests/ServicesTests \
            -only-testing:FollowerTests/AccountViewModelTests \
            -only-testing:FollowerTests/TrendsViewModelTests \
            -only-testing:FollowerTests/GammaServicesTests \
            -only-testing:FollowerTests/PremiumSyncTests \
            -only-testing:FollowerTests/PremiumUnlockTests \
            -only-testing:FollowerTests/PremiumViewModelTests \
            -only-testing:FollowerTests/DraftPostTests \
            -only-testing:FollowerTests/MockInstagramAPIClientTests \
            -only-testing:FollowerTests/MediaKitTests \
            -only-testing:FollowerTests/MediaPostRepositoryTests \
            -only-testing:FollowerTests/MockDraftPostRepository \
            -only-testing:FollowerTests/SeededRandomTests \
            -only-testing:FollowerTests/MockFollowerListGeneratorTests \
            -derivedDataPath /tmp/FollowerDD CODE_SIGNING_ALLOWED=NO || true

  ui-tests:
    name: UI Tests
    runs-on: macos-26
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone GRDB (Vendored Dependency)
        run: |
          mkdir -p Vendor
          cd Vendor
          git clone --depth 1 --branch v7.11.0 \
            https://github.com/groue/GRDB.swift.git GRDB.swift-7.11.0

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -project Follower.xcodeproj \
            -scheme Follower \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:FollowerUITests \
            -derivedDataPath /tmp/FollowerDD CODE_SIGNING_ALLOWED=NO

      - name: Run UI Tests (timing-based — allowed to fail)
        run: |
          xcodebuild test-without-building \
            -project Follower.xcodeproj \
            -scheme Follower \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:FollowerUITests/DashboardUITests \
            -only-testing:FollowerUITests/SettingsUITests \
            -only-testing:FollowerUITests/TrendsUITests \
            -only-testing:FollowerUITests/DecisionsUITests \
            -only-testing:FollowerUITests/AccountUITests \
            -only-testing:FollowerUITests/FollowerUITestsLaunchTests \
            -only-testing:FollowerUITests/ThemeAndLanguageUITests \
            -only-testing:FollowerUITests/PremiumUITests \
            -only-testing:FollowerUITests/FollowerUITests \
            -only-testing:FollowerUITests/PostsUITests \
            -only-testing:FollowerUITests/PredictionChartUITests \
            -derivedDataPath /tmp/FollowerDD CODE_SIGNING_ALLOWED=NO || true
