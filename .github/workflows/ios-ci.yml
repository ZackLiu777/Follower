name: iOS CI

on:
  push:
    branches: ["main", "gamma"]
  pull_request:
    branches: ["main", "gamma"]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone GRDB (Vendored Dependency)
        run: |
          mkdir -p Vendor
          cd Vendor
          git clone --depth 1 --branch v7.11.0 \
            https://github.com/groue/GRDB.swift.git GRDB.swift-7.11.0

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -project Follower.xcodeproj \
            -scheme Follower \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:FollowerTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit Tests
        run: |
          xcodebuild test-without-building \
            -project Follower.xcodeproj \
            -scheme Follower \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:FollowerTests \
            CODE_SIGNING_ALLOWED=NO

  ui-tests:
    name: UI Tests
    runs-on: macos-26
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone GRDB (Vendored Dependency)
        run: |
          mkdir -p Vendor
          cd Vendor
          git clone --depth 1 --branch v7.11.0 \
            https://github.com/groue/GRDB.swift.git GRDB.swift-7.11.0

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -project Follower.xcodeproj \
            -scheme Follower \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:FollowerUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI Tests
        run: |
          xcodebuild test-without-building \
            -project Follower.xcodeproj \
            -scheme Follower \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:FollowerUITests \
            CODE_SIGNING_ALLOWED=NO
