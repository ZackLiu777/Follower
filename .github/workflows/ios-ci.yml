name: iOS CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build + Unit Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Clone GRDB dependency
        run: |
          mkdir -p Vendor
          cd Vendor
          git clone --depth 1 --branch v7.11.0 https://github.com/groue/GRDB.swift.git GRDB.swift-7.11.0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode-beta.app/Contents/Developer

      - name: Build
        run: |
          xcodebuild -project Follower.xcodeproj -scheme Follower \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' build

      - name: Unit Tests
        run: |
          xcodebuild -project Follower.xcodeproj -scheme Follower \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            test -only-testing:FollowerTests

      - name: UI Tests
        run: |
          xcodebuild -project Follower.xcodeproj -scheme Follower \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            test -only-testing:FollowerUITests
